version: 0.0
os: linux

files:
  # Deploy backend JAR
  - source: backend/target/task-management-backend-0.0.1-SNAPSHOT.jar
    destination: /opt/taskapp/backend
  
  # Deploy frontend build files to Apache's document root
  - source: frontend/dist/
    destination: /var/www/html/

permissions:
  - object: /scripts/
    pattern: "**"
    owner: root
    mode: 755
  - object: /opt/taskapp/backend/
    pattern: "**"
    owner: root
    mode: 755

hooks:
  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: root

  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
